<?xml version="1.0" encoding="UTF-8"?>
<!--
  VinylSweep brand mark — exported from VinylSweepBrandMark in
  iosbuild/vinylscout/Components/AppBars.swift. viewBox matches the
  28pt SwiftUI source; render at any size.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 28 28">
  <defs>
    <radialGradient id="disc" cx="14" cy="14" r="18" fr="2" fx="14" fy="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcc00" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffedc3" stop-opacity="0.92"/>
    </radialGradient>
  </defs>

  <!-- disc body -->
  <circle cx="14" cy="14" r="14" fill="url(#disc)"/>

  <!-- outer rim stroke -->
  <circle cx="14" cy="14" r="13.45" fill="none" stroke="#000000" stroke-opacity="0.26" stroke-width="1.1"/>

  <!-- mid groove -->
  <circle cx="14" cy="14" r="10" fill="none" stroke="#e5e2e1" stroke-opacity="0.2" stroke-width="0.8"/>

  <!-- inner groove -->
  <circle cx="14" cy="14" r="6" fill="none" stroke="#e5e2e1" stroke-opacity="0.14" stroke-width="0.8"/>

  <!-- center label -->
  <circle cx="14" cy="14" r="4" fill="#131313" fill-opacity="0.82"/>

  <!-- needle / tonearm hint -->
  <g transform="translate(20 7) rotate(-28)">
    <rect x="-6" y="-1" width="12" height="2" rx="1" ry="1" fill="#e5e2e1" fill-opacity="0.15"/>
  </g>
</svg>
